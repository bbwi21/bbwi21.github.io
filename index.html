<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5f9">
<title>👑 민선 님 전용 비서실</title>
<style>
  :root{
    --bg:#fff9fb;
    --card:#ffffff;
    --surface:#fff5f9;
    --surface2:#ffeef5;
    --line:#fbdcea;
    --line-soft:#fde9f2;
    --pink:#ffd6e7;
    --pink-2:#ffe9f2;
    --accent:#f472b6;
    --accent-2:#ff8fb8;
    --accent-d:#db4b93;
    --rose:#5a2b3f;
    --ink:#4a2e3a;
    --ink-soft:#6b4a57;
    --muted:#8f6b7e;
    --green:#4cbf8f;
    --shadow:0 20px 50px rgba(244,114,182,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 520px at 6% -8%, #fff2f8 0%, rgba(255,242,248,0) 60%),
      radial-gradient(900px 520px at 102% -4%, #ffe6f1 0%, rgba(255,230,241,0) 58%),
      linear-gradient(165deg,#fffafc 0%,#fff5f9 55%,#ffeef5 100%);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(244,114,182,.13) 1px, transparent 1.4px);
    background-size:24px 24px;opacity:.5;
  }
  button{font-family:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid #f4a0c6;outline-offset:2px;
  }

  .stage{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:26px 18px 34px}
  .app{
    background:var(--card);
    border-radius:30px;
    border:1px solid #ffe1ee;
    box-shadow:var(--shadow),0 0 0 6px rgba(255,255,255,.55);
    overflow:hidden;
    display:flex;flex-direction:column;
  }

  /* ── 헤더 ───────────────────────────── */
  .app-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 22px 16px;
    background:linear-gradient(180deg,#fff9fc,#ffeef7);
    border-bottom:1px solid var(--line);
  }
  .head-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
  .crown{
    width:44px;height:44px;flex:0 0 44px;border-radius:50%;
    display:grid;place-items:center;font-size:21px;
    background:linear-gradient(145deg,#ffe4f0,#ffc6de);
    box-shadow:inset 0 0 0 1px #ffd0e4,0 5px 12px rgba(244,114,182,.24);
    position:relative;
  }
  .crown::after{
    content:"✦";position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;
    border-radius:50%;background:#fff;color:#f472b6;font-size:9px;line-height:1;
    display:grid;place-items:center;box-shadow:0 2px 6px rgba(244,114,182,.35);
    border:1px solid #ffe0ee;
  }
  h1{
    margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--rose);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sub{
    margin:4px 0 0;font-size:11.5px;color:var(--muted);
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4;
  }
  .dot-mini{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex:0 0 6px}
  .sep{opacity:.55}
  .live{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:800;color:#2f8a63;
    background:#e9f9f1;border:1px solid #c8f0dc;
    padding:6px 11px;border-radius:999px;white-space:nowrap;flex:0 0 auto;
  }
  .live .dot{
    width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(76,191,143,.5);animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(76,191,143,.45)}
    70%{box-shadow:0 0 0 7px rgba(76,191,143,0)}
    100%{box-shadow:0 0 0 0 rgba(76,191,143,0)}
  }
  .live.warn{color:#a86b1e;background:#fff7e8;border-color:#ffe2b8}
  .live.warn .dot{background:#e0b25a;animation:none;box-shadow:none}
  .live.off{color:#8f6b7e;background:#f8f3f6;border-color:#eee3ea}
  .live.off .dot{background:#bca9b4;animation:none;box-shadow:none}

  /* ── 메인 탭 ────────────────────────── */
  .tabs{
    display:flex;gap:6px;padding:10px 12px;
    background:#fff2f8;border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 8px;border:0;border-radius:15px;background:transparent;
    color:#a97f92;font-size:13px;font-weight:800;cursor:pointer;transition:.18s;
    white-space:nowrap;
  }
  .tab:hover{background:#ffe6f1;color:#c2477f}
  .tab .ic{font-size:15px;line-height:1}
  .tab.active{
    background:linear-gradient(160deg,#ff9ec9,#f062a9);
    color:#fff;box-shadow:0 8px 18px rgba(240,98,169,.28);
  }

  .panel{display:none;padding:16px 18px 20px}
  .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ── 회의실 ─────────────────────────── */
  .room-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:10px;
  }
  .subtabs{display:flex;gap:7px;flex-wrap:wrap}
  .subtab{
    border:1px solid #fbd9e8;background:#fff;color:#a97f92;
    font-size:12px;font-weight:800;padding:7px 13px;border-radius:999px;
    cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .subtab:hover{border-color:#f5b6d1;color:#c2477f}
  .subtab.active{
    background:#fff;border-color:#f7b3cf;color:#d6337f;
    box-shadow:0 3px 10px rgba(244,114,182,.2);
  }
  .room-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;padding-left:2px}

  .chat-wrap{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#fff8fc,#fff2f8)}
  .chat-scroll{height:clamp(300px,42vh,430px);overflow-y:auto;padding:16px 14px 6px;scroll-behavior:smooth;overscroll-behavior:contain}
  .chat-scroll::-webkit-scrollbar{width:6px}
  .chat-scroll::-webkit-scrollbar-thumb{background:#f8cfe2;border-radius:99px}

  .msg{display:flex;gap:9px;margin-bottom:14px;animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{
    width:34px;height:34px;flex:0 0 34px;border-radius:50%;
    display:grid;place-items:center;font-size:15px;font-weight:800;color:#c2477f;
    border:2px solid #fff;box-shadow:0 3px 8px rgba(244,114,182,.18);
  }
  .av-mong{background:linear-gradient(160deg,#ffe3ef,#ffc9e0);color:#c2477f}
  .av-sunny{background:linear-gradient(160deg,#fff1d8,#ffe1b3);color:#b57b32}
  .av-han{background:linear-gradient(160deg,#e4efff,#d3e4ff);color:#5b78b5}
  .av-daon{background:linear-gradient(160deg,#e4f7ea,#d2f0dd);color:#4f8f68}
  .av-me{background:linear-gradient(160deg,#ffe6f1,#ffd0e5)}
  .msg .body{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:86%}
  .who{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
  .nm{font-size:11.5px;font-weight:800;color:#7a3d59}
  .rl{font-size:10px;color:#9c6f85;background:#fff0f7;border-radius:999px;padding:2px 7px;white-space:nowrap}
  .tm{font-size:10px;color:#a9808f}
  .bubble{
    background:#fff;border:1px solid #fbdcea;
    border-radius:4px 16px 16px 16px;
    padding:11px 14px;font-size:13.5px;line-height:1.65;color:var(--ink);
    box-shadow:0 3px 10px rgba(244,114,182,.07);
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.me{flex-direction:row-reverse}
  .msg.me .body{align-items:flex-end;max-width:88%}
  .msg.me .who{flex-direction:row;justify-content:flex-end}
  .msg.me .nm{color:#a8396f}
  .msg.me .bubble{
    background:linear-gradient(160deg,#ffe0ee,#ffcbe3);
    border-color:#f9bcd6;border-radius:16px 4px 16px 16px;color:var(--rose);
  }
  .typing .bubble{display:flex;gap:4px;align-items:center;padding:13px 16px}
  .typing .bubble i{width:6px;height:6px;border-radius:50%;background:#eda6c5;display:block;animation:bounce 1s infinite}
  .typing .bubble i:nth-child(2){animation-delay:.15s}
  .typing .bubble i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}

  .composer{background:#fff7fb;border-top:1px solid var(--line);padding:10px 12px 12px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    border:1px solid #fbd9e8;background:#fff;color:#a4738a;
    font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:999px;
    white-space:nowrap;cursor:pointer;transition:.15s;flex:0 0 auto;
  }
  .chip:hover{border-color:#f5b6d1;color:#d6337f;background:#fff5fa}
  .chip.all{background:linear-gradient(160deg,#ffe1ee,#ffc9e2);border-color:#f7b6d2;color:#b13a72}
  .input-row{display:flex;gap:8px;align-items:flex-end}
  #chatInput{
    flex:1;resize:none;border:1px solid #fbd6e6;background:#fff;
    border-radius:16px;padding:11px 14px;font-family:inherit;font-size:13.5px;
    line-height:1.5;color:var(--ink);min-height:44px;max-height:110px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  #chatInput:focus{border-color:#f4a8cb;box-shadow:0 0 0 3px rgba(244,168,203,.22)}
  .send{
    width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:0;
    background:linear-gradient(160deg,#ff8fb8,#ef5fa4);color:#fff;font-size:18px;
    cursor:pointer;box-shadow:0 8px 16px rgba(240,95,164,.3);
    display:grid;place-items:center;transition:.15s;
  }
  .send:hover{filter:brightness(1.05)}
  .send:active{transform:scale(.94)}

  /* ── 작업실 ─────────────────────────── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filter{
    border:1px solid #fbdceb;background:#fff;color:#a4738a;
    font-size:12px;font-weight:800;padding:7px 13px;border-radius:999px;
    cursor:pointer;transition:.15s;
  }
  .filter:hover{border-color:#f5b6d1;color:#c2477f}
  .filter.active{background:linear-gradient(160deg,#ff9ec9,#f062a9);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(240,98,169,.26)}
  .filter .cnt{opacity:.8;font-weight:700;margin-left:2px}

  .progress{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:#fff4f9;border:1px solid var(--line);
    border-radius:16px;margin-bottom:14px;
  }
  .bar{flex:1;height:8px;border-radius:99px;background:#ffe3ef;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb6d5,#f472b6);border-radius:99px;transition:width .35s ease}
  .pg-text{font-size:11.5px;color:#9d6d84;font-weight:800;white-space:nowrap}

  .task-list{display:grid;gap:10px}
  .task{
    position:relative;display:flex;gap:11px;padding:13px 14px;
    background:#fff;border:1px solid var(--line);border-radius:18px;
    transition:.18s;
  }
  .task:hover{box-shadow:0 10px 24px rgba(244,114,182,.12);transform:translateY(-1px);border-color:#f7c9df}
  .task.done{background:#fff8fc;opacity:.94}
  .task.done .t-title{text-decoration:line-through;color:#ab8998}
  .check{
    width:22px;height:22px;flex:0 0 22px;border-radius:50%;
    border:2px solid #f7c6dc;background:#fff;margin-top:2px;cursor:pointer;
    display:grid;place-items:center;font-size:11px;color:transparent;padding:0;transition:.15s;
  }
  .check:hover{border-color:#f08dbb}
  .task.done .check{background:#f472b6;border-color:#f472b6;color:#fff}
  .t-body{min-width:0;flex:1;padding-right:14px}
  .t-title{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.45;letter-spacing:-.01em}
  .t-meta{font-size:11.5px;color:#a4738a;margin-top:4px;line-height:1.5}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px}
  .tag.exp{background:#ffe3ef;color:#c2477f}
  .tag.fin{background:#e8eefc;color:#5b78b5}
  .tag.life{background:#e4f5e9;color:#4f8f68}
  .tag.dday{background:#ffedf4;color:#b13a72}
  .tag.who{background:#f7f0f4;color:#8a6c7b}
  .tag.dday.soon{background:#ffd9e7;color:#c2185b}
  .del{
    position:absolute;right:7px;top:7px;border:0;background:transparent;
    color:#e0c2d2;font-size:15px;line-height:1;cursor:pointer;padding:3px 5px;border-radius:8px;
  }
  .del:hover{color:#d6337f;background:#fff0f6}

  .add-box{margin-top:16px;padding:14px;background:#fff5fa;border:1px dashed #f9c9de;border-radius:18px}
  .add-title{font-size:11.5px;font-weight:800;color:#9d6d84;margin-bottom:9px}
  .add-row{display:flex;gap:8px;flex-wrap:wrap}
  .add-row input[type=text]{
    flex:1 1 210px;min-width:0;border:1px solid #fbd6e6;background:#fff;
    border-radius:13px;padding:10px 12px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;
  }
  .add-row input[type=date],.add-row select{
    border:1px solid #fbd6e6;background:#fff;border-radius:13px;
    padding:10px 10px;font-family:inherit;font-size:12.5px;color:#7a5568;outline:none;
  }
  .btn-add{
    background:linear-gradient(160deg,#ff8fb8,#ef5fa4);color:#fff;border:0;
    border-radius:13px;padding:10px 16px;font-weight:800;font-size:12.5px;cursor:pointer;
    box-shadow:0 6px 14px rgba(240,95,164,.24);
  }
  .btn-add:hover{filter:brightness(1.05)}

  /* ── 비서현황 ───────────────────────── */
  .sec-title{font-size:13px;font-weight:800;color:var(--rose);margin:0 0 11px;display:flex;align-items:center;gap:6px}
  .team-grid{display:grid;gap:12px}
  .member{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 14px rgba(244,114,182,.05)}
  .m-head{display:flex;align-items:center;gap:11px}
  .m-avatar{
    width:48px;height:48px;flex:0 0 48px;border-radius:50%;
    display:grid;place-items:center;font-size:21px;font-weight:800;color:#c2477f;
    border:2px solid #fff;box-shadow:0 5px 12px rgba(244,114,182,.18);
  }
  .m-id{min-width:0;flex:1}
  .m-name{font-size:14px;font-weight:800;color:var(--ink)}
  .m-role{font-size:11px;color:#a4738a;margin-top:2px}
  .state{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .state.on{background:#ffe8f2;color:#c2477f;border:1px solid #fbd0e3}
  .state.off{background:#f7f2f5;color:#a9899a;border:1px solid #efe4ea}
  .m-desc{font-size:11.5px;color:#8a6c7b;margin-top:11px;line-height:1.6}
  .m-stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;background:#fff6fa;border-radius:12px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-size:15px;color:#b13a72}
  .stat span{font-size:10px;color:#a9808f}
  .m-comment{margin-top:11px;font-size:11.5px;color:#8a6c7b;background:#fff6fa;border-radius:12px;padding:9px 11px;line-height:1.55}

  /* ── 메모 ───────────────────────────── */
  .memo-add{display:flex;gap:8px;margin-bottom:14px}
  #memoInput{
    flex:1;min-width:0;border:1px solid #fbd6e6;background:#fff;
    border-radius:14px;padding:12px 14px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;
  }
  #memoInput:focus{border-color:#f4a8cb;box-shadow:0 0 0 3px rgba(244,168,203,.22)}
  .memo-list{display:grid;gap:8px}
  .memo{
    display:flex;gap:10px;align-items:flex-start;background:#fff;
    border:1px solid var(--line);border-radius:16px;padding:12px 13px;
  }
  .memo .check{width:20px;height:20px;flex:0 0 20px;margin-top:0;font-size:10px}
  .memo.done{background:#fff8fc}
  .memo.done .check{background:#f472b6;border-color:#f472b6;color:#fff}
  .memo.done .mt{text-decoration:line-through;color:#c2a3b2}
  .mt{font-size:13px;color:var(--ink);line-height:1.5;flex:1;word-break:break-word}
  .mt small{display:block;font-size:10px;color:#a9808f;margin-top:3px;text-decoration:none}

  /* ── 오피스 맵 ──────────────────────── */
  .office-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:12px;
  }
  .office-title{
    margin:0;font-size:16px;font-weight:900;letter-spacing:-.02em;color:var(--rose);
    display:flex;align-items:center;gap:7px;
  }
  .office-title .ot-ic{font-size:15px}
  .office-sub{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}
  .office-cta{
    flex:0 0 auto;border:1px solid #f7c6dc;background:#fff;color:#c2477f;
    font-size:11.5px;font-weight:800;padding:9px 13px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 12px rgba(244,114,182,.14);transition:.18s;white-space:nowrap;
  }
  .office-cta:hover{background:#fff2f8;border-color:#f4a0c6;transform:translateY(-1px)}
  .office-cta:active{transform:translateY(0)}

  .office-card{
    border:1px solid var(--line);border-radius:24px;overflow:hidden;
    background:linear-gradient(180deg,#fffafc,#fff3f8);
    box-shadow:0 12px 30px rgba(244,114,182,.12),inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .office-stage{
    position:relative;overflow:hidden;background:#fdf0f4;
    border-bottom:1px solid var(--line-soft);isolation:isolate;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .office-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .office-stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,0) 55%,rgba(255,241,247,.42) 100%);
  }

  /* 움직이는 비서 캐릭터 */
  .agent-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
  .agent{
    position:absolute;width:clamp(32px,3.9vw,46px);transform:translate(-50%,-50%);
    transition-property:left,top;transition-duration:3s;transition-timing-function:cubic-bezier(.42,0,.28,1);
    pointer-events:auto;cursor:pointer;border:0;background:none;padding:0;
    display:flex;flex-direction:column;align-items:center;
    -webkit-tap-highlight-color:transparent;z-index:10;
  }
  .agent:focus-visible{outline:2px solid #f4a0c6;outline-offset:4px;border-radius:12px}
  .agent-body{display:flex;flex-direction:column;align-items:center;position:relative;animation:agentBreathe 3.2s ease-in-out infinite}
  .agent.walking .agent-body{animation:agentWalk .58s ease-in-out infinite}
  .agent.hop .agent-body{animation:agentHop .5s ease}
  @keyframes agentBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes agentWalk{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-4px) rotate(2.5deg)}}
  @keyframes agentHop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-9px) scale(1.06)}70%{transform:translateY(1px) scale(.98)}100%{transform:translateY(0) scale(1)}}
  .agent-shadow{
    width:62%;height:5px;border-radius:50%;margin-top:-2px;
    background:radial-gradient(closest-side,rgba(180,120,145,.3),rgba(180,120,145,0));
  }
  .agent-av{
    width:100%;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;
    font-size:clamp(17px,2.5vw,29px);line-height:1;border:2px solid #fff;
    box-shadow:0 5px 12px rgba(196,86,140,.26),inset 0 -4px 8px rgba(255,255,255,.75),inset 0 2px 6px rgba(255,255,255,.55);
  }
  .agent-name{
    margin-top:3px;font-size:clamp(8px,1.05vw,10.5px);font-weight:800;letter-spacing:-.01em;color:#8e4a68;
    background:rgba(255,255,255,.94);padding:1.5px 6px;border-radius:999px;
    box-shadow:0 2px 6px rgba(196,86,140,.16);white-space:nowrap;
    border:1px solid rgba(251,220,234,.9);
  }
  .agent-bubble{
    position:absolute;bottom:calc(100% + 2px);left:50%;transform:translate(-50%,4px) scale(.94);
    background:#fff;color:#7a3d59;border:1px solid #fbd6e6;border-radius:12px;
    padding:5px 8px;font-size:9.5px;font-weight:700;line-height:1.35;white-space:normal;
    text-align:center;width:max-content;
    box-shadow:0 8px 18px rgba(196,86,140,.2);opacity:0;pointer-events:none;transition:.22s;
    z-index:5;max-width:168px;
  }
  .agent-bubble::after{
    content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:#fff;
    border-right:1px solid #fbd6e6;border-bottom:1px solid #fbd6e6;
    transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:2px;
  }
  .agent-bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .agent.side-left .agent-bubble{left:auto;right:-6px;transform:translate(0,4px) scale(.94)}
  .agent.side-left .agent-bubble.show{transform:translate(0,0) scale(1)}
  .agent.side-left .agent-bubble::after{left:auto;right:14px;transform:rotate(45deg)}
  .agent.side-right .agent-bubble{left:-6px;right:auto;transform:translate(0,4px) scale(.94)}
  .agent.side-right .agent-bubble.show{transform:translate(0,0) scale(1)}
  .agent.side-right .agent-bubble::after{left:14px;transform:rotate(45deg)}

  /* 구역 핀 */
  .pin{
    position:absolute;transform:translate(-50%,-50%);z-index:25;
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.95);
    color:#7a3d59;font-size:10.5px;font-weight:800;letter-spacing:-.01em;
    padding:5px 10px 5px 8px;border-radius:999px;cursor:pointer;
    box-shadow:0 6px 16px rgba(140,80,105,.22);transition:.18s;white-space:nowrap;
    backdrop-filter:blur(4px);
  }
  .pin:hover{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 9px 20px rgba(140,80,105,.26)}
  .pin:active{transform:translate(-50%,-50%) scale(.98)}
  .pin-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
  .lg-a,.pin-assembly .pin-dot{background:#e0849f}
  .lg-c,.pin-command .pin-dot{background:#7fa0d2}
  .lg-l,.pin-lounge .pin-dot{background:#7dbb95}

  .office-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    padding:10px 13px;background:linear-gradient(180deg,#fffafc,#fff2f8);
  }
  .office-foot-note{font-size:10px;color:#a9808f;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .office-legend{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
  .office-legend .legend-btn{
    display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:#8f6b7e;font-weight:700;
    white-space:nowrap;border:1px solid transparent;background:none;padding:3px 6px;border-radius:999px;
    cursor:pointer;transition:.16s;-webkit-tap-highlight-color:transparent;
  }
  .office-legend .legend-btn:hover{background:#fff;border-color:#fbdcea;color:#7a3d59;box-shadow:0 3px 9px rgba(196,86,140,.12)}
  .office-legend .legend-btn:active{transform:scale(.97)}
  .office-legend i{width:6px;height:6px;border-radius:50%;display:inline-block}

  .empty{
    text-align:center;font-size:12px;color:#a9808f;
    padding:26px 10px;background:#fffafc;border:1px dashed #f9d3e4;border-radius:16px;line-height:1.7;
  }

  .foot{text-align:center;font-size:10.5px;color:#a9808f;margin:14px 0 0;line-height:1.6}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:#8e2b57;color:#fff;font-size:12px;font-weight:700;
    padding:10px 16px;border-radius:999px;box-shadow:0 10px 24px rgba(142,43,87,.28);
    opacity:0;pointer-events:none;transition:.22s;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(min-width:760px){
    .task-list,.memo-list{grid-template-columns:1fr 1fr}
    .team-grid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:560px){
    .stage{padding:10px 8px 24px}
    .app{border-radius:22px}
    .app-head{padding:14px 14px 12px}
    h1{font-size:15.5px}
    .crown{width:38px;height:38px;flex-basis:38px;font-size:18px}
    .live{font-size:10px;padding:5px 8px;gap:4px}
    .tab{font-size:11.5px;padding:9px 4px;gap:4px}
    .tab .ic{font-size:13px}
    .panel{padding:12px 12px 16px}
    .chat-scroll{height:clamp(280px,47vh,410px);padding:13px 10px 4px}
    .bubble{font-size:12.5px;padding:10px 12px}
    .msg .body{max-width:88%}
    .sub{font-size:10.5px}
    .sub .sep,#headDate{display:none}
    .room-head{flex-direction:column;align-items:flex-start;gap:7px}
    .room-meta{font-size:10.5px}
    #chatInput,#memoInput,.add-row input[type=text],.add-row input[type=date],.add-row select{font-size:16px}
    .office-title{font-size:14.5px}
    .office-sub{font-size:10.5px}
    .office-cta{font-size:10.5px;padding:8px 11px}
    .agent-name{font-size:8px;padding:1px 5px}
    .agent-bubble{font-size:9px;padding:4px 7px;max-width:136px}
    .pin{font-size:9.5px;padding:4px 8px 4px 7px;gap:4px}
    .office-foot{padding:9px 10px}
    .office-foot-note{font-size:9px}
    .office-legend .legend-btn{font-size:8.5px;padding:2px 4px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
</style>
</head>

      if(raw) saved = JSON.parse(raw);
    }catch(e){ saved = null; }

      state.room = (saved.room && ROOM_INFO[saved.room]) ? saved.room : "assembly";

      state.rooms = clone(SEED_ROOMS);
      state.tasks = clone(SEED_TASKS);
      state.memos = clone(SEED_MEMOS);
    }

  var DB_ROOT = "minseon_office";
  var FIREBASE_CFG = {
    apiKey: "AIzaSyA80mqqDIrDLa2cF5naWnkbuC_kv3xFVTc",

  function setSync(stateKind, text){

  function newId(prefix){
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function dbPut(path, val){
    if(!fdb) return;
    try{ fdb.ref(DB_ROOT + "/" + path).set(val); }catch(e){}
  }
  function dbPatch(path, val){
    if(!fdb) return;
    try{ fdb.ref(DB_ROOT + "/" + path).update(val); }catch(e){}
  }
  function dbDel(path){
    if(!fdb) return;
    try{ fdb.ref(DB_ROOT + "/" + path).remove(); }catch(e){}
  }

  function seedPayload(){
    var out = {rooms:{}, tasks:{}, memos:{}};
    Object.keys(SEED_ROOMS).forEach(function(room){
      var bag = {};
      SEED_ROOMS[room].forEach(function(m, i){
        bag["s" + (i + 1)] = {who:m.who, text:m.text, time:m.time, ts:i + 1};
      });
      out.rooms[room] = bag;
    });
    SEED_TASKS.forEach(function(t, i){
      out.tasks[t.id] = {title:t.title, meta:t.meta, cat:t.cat, who:t.who,
                         due:t.due || "", done:!!t.done, ord:(SEED_TASKS.length - i) * 1000};
    });
    SEED_MEMOS.forEach(function(m, i){
      out.memos[m.id] = {text:m.text, done:!!m.done, ord:(SEED_MEMOS.length - i) * 1000};
    });
    return out;
  }

  function msgArray(bag){
    var list = [];
    if(!bag || typeof bag !== "object") return list;
    Object.keys(bag).forEach(function(k){
      var m = bag[k];
      if(!m || typeof m !== "object") return;
      list.push({id:k, who:m.who || "mong", text:m.text || "",
                 time:m.time || "", ts:(typeof m.ts === "number" ? m.ts : 0)});
    });
    list.sort(function(a, b){ return (a.ts - b.ts) || (a.id < b.id ? -1 : 1); });
    return list;
  }

  function itemArray(bag){
    var list = [];
    if(!bag || typeof bag !== "object") return list;
    Object.keys(bag).forEach(function(k){
      var t = bag[k];
      if(!t || typeof t !== "object") return;
      list.push({id:k, title:t.title || "", text:t.text || "", meta:t.meta || "",
                 cat:t.cat || "exp", who:t.who || "mong", due:t.due || null,
                 done:!!t.done, ord:(typeof t.ord === "number" ? t.ord : 0)});
    });
    list.sort(function(a, b){ return (b.ord - a.ord) || (a.id < b.id ? -1 : 1); });
    return list;
  }

  function attachDb(){
    var root = fdb.ref(DB_ROOT);

    fdb.ref(".info/connected").on("value", function(s){
      dbLive = !!s.val();
      if(!dbLive) setSync("warn", "재연결 중…");
      else if(dataReady) setSync(true, "실시간 DB 연결");
      else setSync("warn", "연결 확인 중…");
    });

    root.once("value").then(function(snap){
      if(snap.exists()) return null;
      return root.set(seedPayload());   // 비어 있을 때만 초기 데이터 1회 저장
    }).then(function(){
      root.child("rooms").on("value", applyRooms);
      root.child("tasks").on("value", applyTasks);
      root.child("memos").on("value", applyMemos);
      dataReady = true;
      if(dbLive) setSync(true, "실시간 DB 연결");
    }).catch(function(){
      setSync("off", "로컬 저장 모드");
    });
  }

  function initDb(){

        return;

      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CFG);
      fdb = firebase.database();
      attachDb();
    }catch(e){
      fdb = null;
      setSync("off", "로컬 저장 모드");
    }
  }

  /* ── 공통 유틸 ──────────────────────────── */
  function $(sel){ return document.querySelector(sel); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function nowTime(){
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? "오전" : "오후";
    var hh = h % 12; if(hh === 0) hh = 12;
    return ap + " " + hh + ":" + String(m).padStart(2, "0");
  }
  function todayLabel(){
    var d = new Date();
    var w = ["일","월","화","수","목","금","토"][d.getDay()];
    return d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() + ". (" + w + ")";
  }
  function ddayOf(due){
    if(!due) return {text:"일정 미정", soon:false};
    var today = new Date(); today.setHours(0,0,0,0);
    var target = new Date(due + "T00:00:00");
    if(isNaN(target.getTime())) return {text:"일정 미정", soon:false};
    var diff = Math.round((target - today) / 86400000);
    if(diff === 0) return {text:"D-DAY", soon:true};
    if(diff > 0) return {text:"D-" + diff, soon:diff <= 3};
    return {text:"D+" + (-diff), soon:false};
  }
  function toast(msg){
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._tm);
    toast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1700);
  }

  function messageNode(m){
    var p = PEOPLE[m.who] || PEOPLE.mong;
    var wrap = el("div", "msg" + (m.who === "me" ? " me" : ""));

    var av = el("div", "avatar " + p.av, p.emoji);
    av.setAttribute("aria-hidden", "true");

    var body = el("div", "body");
    var who = el("div", "who");
    who.appendChild(el("span", "nm", p.name));
    if(m.who !== "me"){
      who.appendChild(el("span", "rl", p.role));
    }
    who.appendChild(el("span", "tm", m.time || ""));
    body.appendChild(who);

    var bubble = el("div", "bubble");
    bubble.textContent = m.text;
    body.appendChild(bubble);

    wrap.appendChild(av);
    wrap.appendChild(body);
    return wrap;
  }

  function pushMessage(room, msg){
    if(!state.rooms[room]) state.rooms[room] = [];
    if(!msg.id) msg.id = newId("g");
    if(typeof msg.ts !== "number") msg.ts = Date.now();
    if(!msg.time) msg.time = nowTime();
    state.rooms[room].push(msg);
    saveState();
    dbPut("rooms/" + room + "/" + msg.id, {who:msg.who, text:msg.text, time:msg.time, ts:msg.ts});
    if(state.room === room) renderRoom();
  }

    var visible = all.filter(function(t){ return state.filter === "all" || t.cat === state.filter; });
    if(!visible.length){
      var empty = el("div", "empty", state.filter === "all"
        ? "아직 작업이 없어요. 아래에서 새 작업을 추가해 보세요!"
        : "이 분류에 표시할 작업이 없어요.");
      empty.style.gridColumn = "1 / -1";
      list.appendChild(empty);
    }else{
      visible.forEach(function(t){ list.appendChild(taskNode(t)); });
    }

    var done = all.filter(function(t){ return t.done; }).length;
    var pct = all.length ? Math.round(done / all.length * 100) : 0;
    $("#pgBar").style.width = pct + "%";
    $("#pgText").textContent = "완료 " + done + " / " + all.length + " (" + pct + "%)";
  }

  function taskNode(t){
    var cat = CAT_INFO[t.cat] || CAT_INFO.exp;
    var dd = ddayOf(t.due);
    var card = el("div", "task" + (t.done ? " done" : ""));

    var check = el("button", "check", "✓");
    check.type = "button";
    check.setAttribute("aria-label", t.done ? "완료 취소" : "완료 처리");
    check.setAttribute("aria-pressed", t.done ? "true" : "false");
    check.addEventListener("click", function(){
      t.done = !t.done;
      saveState();
      dbPatch("tasks/" + t.id, {done:t.done});
      renderTasks();
      renderTeam();
      toast(t.done ? "완료로 표시했어요 ✓" : "다시 진행 중으로 돌렸어요");
    });

    var body = el("div", "t-body");
    body.appendChild(el("div", "t-title", t.title));
    if(t.meta) body.appendChild(el("div", "t-meta", t.meta));

    var tags = el("div", "tags");
    tags.appendChild(el("span", "tag " + cat.cls, cat.label));
    tags.appendChild(el("span", "tag dday" + (dd.soon && !t.done ? " soon" : ""), dd.text));
    tags.appendChild(el("span", "tag who", PEOPLE[t.who] ? PEOPLE[t.who].name : "몽이"));
    body.appendChild(tags);

    var del = el("button", "del", "×");
    del.type = "button";
    del.setAttribute("aria-label", "작업 삭제");
    del.addEventListener("click", function(){
      if(!window.confirm("이 작업을 삭제할까요?\n\n" + t.title)) return;
      state.tasks = state.tasks.filter(function(x){ return x.id !== t.id; });
      saveState();
      dbDel("tasks/" + t.id);
      renderTasks();
      renderTeam();
      toast("작업을 삭제했어요");
    });

    card.appendChild(check);
    card.appendChild(body);
    card.appendChild(del);
    return card;
  }

  function addTask(){
    var titleEl = $("#newTitle");
    var title = titleEl.value.trim();
    if(!title){
      titleEl.focus();
      toast("할 일을 먼저 적어주세요");
      return;
    }
    var cat = $("#newCat").value;
    var due = $("#newDue").value || null;
    var ord = Date.now();
    state.tasks.forEach(function(x){ if(x.ord && x.ord >= ord) ord = x.ord + 1; });
    var task = {
      id:newId("t"),
      title:title,
      meta: due ? "마감 " + due.slice(5).replace("-", "/") : "일정 미정",
      cat:cat,
      who:(CAT_INFO[cat] || CAT_INFO.exp).who,
      due:due,
      done:false,
      ord:ord
    };
    state.tasks.unshift(task);
    dbPut("tasks/" + task.id, {title:task.title, meta:task.meta, cat:task.cat,
                               who:task.who, due:task.due || "", done:false, ord:task.ord});
    titleEl.value = "";
    $("#newDue").value = "";
    state.filter = "all";
    saveState();
    renderTasks();
    renderTeam();
    toast("새 작업을 추가했어요 📋");
  }

  /* ── 비서현황 ───────────────────────────── */
  var TEAM = [
    {who:"mong", desc:"전체 일정과 모닝 브리핑, 네 비서의 보고를 한곳에서 묶는 총괄 실장.", comment:"내일 7시 모닝 브리핑 준비 완료! 네 분 보고 모두 모아 한 번에 올릴게요."},
    {who:"sunny", desc:"리뷰노트·무신사·쿠팡 신청과 써니로그 대필, 네이버 클립 제작까지.", comment:"43번지 체크리스트 내일 오전 9시, 진미골 발표는 12/8 대기 중입니다."},
    {who:"han", desc:"대교씨엔에스·강원심층수 자금과 세무, 환율, KPI 자금 대시보드.", comment:"11/30 월말 마감 준비 중이고, 자금일보는 퇴근 전에 점검합니다."},
    {who:"daon", desc:"투룸 이상 청약 점검, 건강검진 추적, 사주·결혼 준비, 히로시마 여행.", comment:"오늘 투룸 이상 청약 0건, 12/8 달러박스 알림 대기 중이에요."}
  ];

  function renderTeam(){
    var grid = $("#teamGrid");
    if(!grid) return;
    grid.textContent = "";
    var openAll = state.tasks.filter(function(t){ return !t.done; }).length;
    var doneAll = state.tasks.filter(function(t){ return t.done; }).length;

    TEAM.forEach(function(m){
      var p = PEOPLE[m.who];
      var open, done;
      if(m.who === "mong"){
        open = openAll; done = doneAll;
      }else{
        open = state.tasks.filter(function(t){ return t.who === m.who && !t.done; }).length;
        done = state.tasks.filter(function(t){ return t.who === m.who && t.done; }).length;
      }
      var card = el("div", "member");
      var head = el("div", "m-head");
      var av = el("div", "m-avatar " + p.av, p.emoji);
      av.setAttribute("aria-hidden", "true");
      var id = el("div", "m-id");
      id.appendChild(el("div", "m-name", p.name));
      id.appendChild(el("div", "m-role", p.role));
      var st = el("span", "state " + (open > 0 ? "on" : "off"), open > 0 ? "활성" : "대기");
      head.appendChild(av);
      head.appendChild(id);
      head.appendChild(st);

      var desc = el("div", "m-desc", m.desc);

      var stats = el("div", "m-stats");
      var s1 = el("div", "stat");
      s1.appendChild(el("b", null, String(open)));
      s1.appendChild(el("span", null, m.who === "mong" ? "총괄 진행" : "처리 중"));
      var s2 = el("div", "stat");
      s2.appendChild(el("b", null, String(done)));
      s2.appendChild(el("span", null, "완료"));
      stats.appendChild(s1);
      stats.appendChild(s2);

      var cm = el("div", "m-comment", m.comment);

      card.appendChild(head);
      card.appendChild(desc);
      card.appendChild(stats);
      card.appendChild(cm);
      grid.appendChild(card);
    });
  }

  /* ── 메모 ───────────────────────────────── */
  function renderMemos(){
    var list = $("#memoList");
    list.textContent = "";
    if(!state.memos.length){
      var empty = el("div", "empty", "메모가 없어요. 위에서 첫 메모를 남겨 보세요!");
      empty.style.gridColumn = "1 / -1";
      list.appendChild(empty);
    }
    state.memos.forEach(function(m){
      var item = el("div", "memo" + (m.done ? " done" : ""));
      var check = el("button", "check", "✓");
      check.type = "button";
      check.setAttribute("aria-label", m.done ? "체크 해제" : "체크");
      check.setAttribute("aria-pressed", m.done ? "true" : "false");
      check.addEventListener("click", function(){
        m.done = !m.done;
        saveState();
        dbPatch("memos/" + m.id, {done:m.done});
        renderMemos();
      });
      var text = el("div", "mt");
      text.appendChild(document.createTextNode(m.text));
      var del = el("button", "del", "×");
      del.type = "button";
      del.setAttribute("aria-label", "메모 삭제");
      del.style.position = "static";
      del.addEventListener("click", function(){
        if(!window.confirm("이 메모를 삭제할까요?\n\n" + m.text)) return;
        state.memos = state.memos.filter(function(x){ return x.id !== m.id; });
        saveState();
        dbDel("memos/" + m.id);
        renderMemos();
        toast("메모를 삭제했어요");
      });
      item.appendChild(check);
      item.appendChild(text);
      item.appendChild(del);
      list.appendChild(item);
    });
    var left = state.memos.filter(function(m){ return !m.done; }).length;
    $("#memoCount").textContent = "메모 " + state.memos.length + "개 · 남은 일 " + left + "개";
  }

  function addMemo(){
    var input = $("#memoInput");
    var text = input.value.trim();
    if(!text){ input.focus(); return; }
    var ord = Date.now();
    state.memos.forEach(function(x){ if(x.ord && x.ord >= ord) ord = x.ord + 1; });
    var memo = {id:newId("m"), text:text, done:false, ord:ord};
    state.memos.unshift(memo);
    dbPut("memos/" + memo.id, {text:memo.text, done:false, ord:memo.ord});
    input.value = "";
    saveState();
    renderMemos();
    toast("메모를 저장했어요 📝");
  }

  /* ── 오피스 맵 · 움직이는 비서 캐릭터 ───────── */
  var OFFICE_ZONE_NAME = {assembly:"대회의실", command:"지휘실", lounge:"라운지"};
  var OFFICE_ZONES = {
    assembly: [[14,63],[22,76],[33,77],[42,72],[24,68],[36,73]],
    command:  [[52,55],[56,56],[60,52],[63,52],[66,52],[67,58],[54,60]],
    lounge:   [[55,76],[62,81],[70,79],[75,78],[79,73],[82,76]]
  };
  var AGENTS = [
    {id:"mong",  name:"몽이",      emoji:"🐻", cls:"av-mong",  zone:"command",
     lines:["민선 님, 다들 잘 돌아가고 있어요 🌸","지휘실에서 보고 준비 중이에요","필요한 일은 저에게 말씀만 하세요!"]},
    {id:"sunny", name:"써니 비서", emoji:"🐰", cls:"av-sunny", zone:"assembly",
     lines:["체험단 26건 정리 중이에요 ✍️","43번지 준비물 목록 만들게요!","블로그 초안 다듬고 있어요 ☺️"]},
    {id:"han",   name:"한결 비서", emoji:"🐱", cls:"av-han",   zone:"command",
     lines:["월말 자금 마감 체크 중이에요 💼","자금일보 다시 맞춰볼게요!","11/30 세무 마감 준비 완료!"]},
    {id:"daon",  name:"다온 비서", emoji:"🐭", cls:"av-daon",  zone:"lounge",
     lines:["투룸 청약 오늘도 0건이에요 🏠","히로시마 일정 살펴보는 중!","달러박스 알림 대기하고 있어요"]}
  ];

  var officeTimer = null;
  var officeAgents = [];

  function rand(a, b){ return a + Math.random() * (b - a); }

  function crowdDistance(x, y, self){
    var best = 999;
    officeAgents.forEach(function(o){
      if(o === self) return;
      var dx = o.x - x, dy = (o.y - y) * 1.25;
      var d = Math.sqrt(dx * dx + dy * dy);
      if(d < best) best = d;
    });
    return best;
  }

  function zoneCount(zone){
    var n = 0;
    officeAgents.forEach(function(o){ if(o.def.zone === zone) n++; });
    return n;
  }

  function spotFor(zone, self){
    var spots = OFFICE_ZONES[zone] || OFFICE_ZONES.assembly;
    var best = null, bestD = -1;
    for(var i = 0; i < 14; i++){
      var s = spots[Math.floor(Math.random() * spots.length)];
      var x = Math.max(9, Math.min(88, s[0] + rand(-1.4, 1.4)));
      var y = Math.max(8, Math.min(84, s[1] + rand(-1.4, 1.4)));
      var d = crowdDistance(x, y, self);
      if(d >= 9.5) return [x, y];
      if(d > bestD){ bestD = d; best = [x, y]; }
    }
    return best || [30, 70];
  }

  function bubbleSide(st){
    st.el.classList.toggle("side-left", st.x > 74);
    st.el.classList.toggle("side-right", st.x < 26);
  }

  function buildOffice(){
    var layer = document.getElementById("agentLayer");
    if(!layer || layer.getAttribute("data-built") === "1") return;
    layer.setAttribute("data-built", "1");
    AGENTS.forEach(function(a){
      var el = document.createElement("button");
      el.type = "button";
      el.className = "agent";
      el.setAttribute("aria-label", a.name + " 부르기");
      el.innerHTML =
        '<span class="agent-bubble" role="status"></span>' +
        '<span class="agent-body">' +
          '<span class="agent-av ' + a.cls + '" aria-hidden="true">' + a.emoji + '</span>' +
          '<span class="agent-name">' + a.name + '</span>' +
          '<span class="agent-shadow" aria-hidden="true"></span>' +
        '</span>';
      var s = spotFor(a.zone, null);
      el.style.transitionDuration = "0s";
      el.style.left = s[0] + "%";
      el.style.top = s[1] + "%";
      layer.appendChild(el);
      var st = {
        def:a, el:el, bubble:el.querySelector(".agent-bubble"),
        x:s[0], y:s[1], next:0, bubbleTimer:null, walkTimer:null
      };
      officeAgents.push(st);
      bubbleSide(st);
      el.addEventListener("click", function(e){ e.stopPropagation(); greetAgent(st); });
      el.addEventListener("pointerenter", function(){ st.paused = true; });
      el.addEventListener("pointerleave", function(){ st.paused = false; });
      el.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); greetAgent(st); }
      });
      requestAnimationFrame(function(){ el.style.transitionDuration = "3s"; });
    });
  }

  function showBubble(st, text){
    st.bubble.textContent = text;
    st.bubble.classList.add("show");
    clearTimeout(st.bubbleTimer);
    st.bubbleTimer = setTimeout(function(){ st.bubble.classList.remove("show"); }, 3400);
  }

  function greetAgent(st){
    var lines = st.def.lines;
    showBubble(st, lines[Math.floor(Math.random() * lines.length)]);
    st.el.classList.remove("hop");
    void st.el.offsetWidth;
    st.el.classList.add("hop");
    setTimeout(function(){ st.el.classList.remove("hop"); }, 560);
  }

  function moveAgent(st){
    var zones = Object.keys(OFFICE_ZONES);
    var zone = st.def.zone;
    if(Math.random() < 0.72){
      var others = zones.filter(function(z){ return z !== zone && zoneCount(z) < 2; });
      if(others.length) zone = others[Math.floor(Math.random() * others.length)];
    }
    st.def.zone = zone;
    var s = spotFor(zone, st);
    st.x = s[0]; st.y = s[1];
    bubbleSide(st);
    var dur = rand(2.6, 3.4);
    st.el.style.transitionDuration = dur.toFixed(2) + "s";
    st.el.classList.add("walking");
    st.el.style.left = st.x + "%";
    st.el.style.top = st.y + "%";
    clearTimeout(st.walkTimer);
    st.walkTimer = setTimeout(function(){ st.el.classList.remove("walking"); }, dur * 1000 + 80);
  }

  function officeTick(){
    var now = Date.now();
    officeAgents.forEach(function(st){
      if(now >= st.next){
        if(st.paused){ st.next = now + 900; return; }
        moveAgent(st);
        st.next = now + rand(4200, 6200);
      }
    });
  }

  function startOffice(){
    buildOffice();
    if(officeTimer) return;
    var now = Date.now();
    officeAgents.forEach(function(st, i){
      if(!st.next || st.next < now) st.next = now + 900 + i * 1300;
    });
    officeTimer = setInterval(officeTick, 700);
  }

  function stopOffice(){
    if(officeTimer){ clearInterval(officeTimer); officeTimer = null; }
  }

  function goOfficeRoom(room){
    state.room = room;
    saveState();
    renderRoom();
    switchTab("meeting");
    toast(OFFICE_ZONE_NAME[room] + "로 이동했어요 ✨");
  }

  /* ── 탭 전환 ────────────────────────────── */
  function switchTab(name){
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      var on = b.getAttribute("data-tab") === name;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    Array.prototype.forEach.call(document.querySelectorAll(".panel"), function(p){
      p.classList.toggle("active", p.id === "panel-" + name);
    });
    if(name === "work") renderTasks();
    if(name === "team") renderTeam();
    if(name === "memo") renderMemos();
    if(name === "meeting"){
      renderRoom();
    }
    if(name === "office"){ startOffice(); } else { stopOffice(); }
  }

  /* ── 초기화 ─────────────────────────────── */
  function init(){
    chatScroll = $("#chatScroll");
    chatInput = $("#chatInput");
    $("#headDate").textContent = todayLabel();

    loadState();

    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".subtab"), function(b){
      b.addEventListener("click", function(){
        state.room = b.getAttribute("data-room");
        saveState();
        renderRoom();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".pin"), function(b){
      b.addEventListener("click", function(){ goOfficeRoom(b.getAttribute("data-room")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".legend-btn"), function(b){
      b.addEventListener("click", function(){ goOfficeRoom(b.getAttribute("data-room")); });
    });

    /* 방 그림(이미지 영역) 직접 클릭 — 좌표로 방을 고름 */
    var officeStage = document.getElementById("officeStage");
    if(officeStage){
      officeStage.addEventListener("click", function(e){
        var t = e.target;
        if(t && t.closest && t.closest("button")) return;   // 핀·캐릭터는 각자 처리
        var r = officeStage.getBoundingClientRect();
        if(!r.width || !r.height) return;
        var x = (e.clientX - r.left) / r.width * 100;
        var y = (e.clientY - r.top) / r.height * 100;
        var room = (x < 50) ? "assembly" : (y < 52 ? "command" : "lounge");
        goOfficeRoom(room);
      });
    }
    var officeCta = document.getElementById("officeCta");
    if(officeCta){ officeCta.addEventListener("click", function(){ goOfficeRoom("command"); }); }
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(b){
      b.addEventListener("click", function(){
        var tag = b.getAttribute("data-mention") + " ";
        var val = chatInput.value;
        var focused = document.activeElement === chatInput;
        if(!focused || val === ""){
          chatInput.value = (val ? val.replace(/\s+$/, "") + " " : "") + tag;
        }else{
          var s0 = chatInput.selectionStart || 0;
          var s1 = chatInput.selectionEnd || s0;
          var pre = val.slice(0, s0);
          var post = val.slice(s1);
          if(pre && !/\s$/.test(pre)) pre += " ";
          chatInput.value = pre + tag + post;
        }
        chatInput.focus();
        var pos = chatInput.value.length;
        try{ chatInput.setSelectionRange(pos, pos); }catch(e){}
        autoGrow();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".filter"), function(b){
      b.addEventListener("click", function(){
        state.filter = b.getAttribute("data-filter");
        saveState();
        renderTasks();
      });
    });

    $("#sendBtn").addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey && !e.isComposing){
        e.preventDefault();
        sendMessage();
      }
    });
    chatInput.addEventListener("input", autoGrow);

    $("#addTaskBtn").addEventListener("click", addTask);
    $("#newTitle").addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addTask(); }
    });

    $("#addMemoBtn").addEventListener("click", addMemo);
    $("#memoInput").addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addMemo(); }
    });

    renderRoom();
    renderTasks();
    renderTeam();
    renderMemos();
    switchTab("office");
    initDb();

    document.addEventListener("visibilitychange", function(){
      if(document.hidden){ stopOffice(); }
      else if(document.getElementById("panel-office").classList.contains("active")){ startOffice(); }
    });
  }

  function autoGrow(){
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + "px";
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  }else{
    init();
  }
})();
</script>
</body>
</html>
